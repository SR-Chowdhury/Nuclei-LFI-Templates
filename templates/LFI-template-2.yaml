id: sr7-lfi-wordlist-file-disclosure

info:
  name: LFI File Disclosure - Custom Payload List
  author: sr7
  severity: high
  description: |
    Checks candidate paths from a local payload wordlist for possible Linux or
    Windows file disclosure. Manually verify every match.
  reference:
    - https://owasp.org/www-community/attacks/Path_Traversal
    - https://github.com/emadshanab/LFI-Payload-List
  tags: lfi,path-traversal,file-disclosure,wordlist

http:
  - method: GET
    # Change the endpoint/parameter to match the authorised lab request.
    path:
      - "{{BaseURL}}/?page={{lfi_payload}}"

    # Run Nuclei from the repository root; this path is relative to that directory.
    payloads:
      lfi_payload: payloads/lfi-payloads.txt

    stop-at-first-match: true
    redirects: true
    max-redirects: 3

    matchers-condition: or
    matchers:
      - type: regex
        name: linux-passwd
        part: body
        regex:
          - '(?m)^root:[^:]*:0:0:[^:]*:/root:'

      - type: word
        name: windows-winini
        part: body
        words:
          - "[fonts]"
          - "[extensions]"
        condition: and
